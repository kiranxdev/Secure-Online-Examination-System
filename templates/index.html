<!DOCTYPE html>
<html>
<head>
    <title>Secure Online Examination System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            color: #243b55;
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 95%;
            padding: 12px;
            margin-top: 15px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>🔐 Secure Online Exam</h1>
        <p>Student Login</p>

        <form action="/login" method="POST">

    <input type="text" name="student_id" placeholder="Enter Student ID" required>

    <input type="password" name="password" placeholder="Enter Password" required>

    <button type="submit">Login</button>

</form>
    </div>

</body>
</html>
